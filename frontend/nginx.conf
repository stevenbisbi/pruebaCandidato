server {
    listen 80;
    root /usr/share/nginx/html;

    # El lote de 50.000 lineas pesa ~2,6 MB y tarda unos segundos en procesarse.
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
    }

    # Rutas del SPA (/facturas, /lotes, /tablero): un enlace compartido debe abrir la misma vista.
    location / {
        try_files $uri /index.html;
    }
}
