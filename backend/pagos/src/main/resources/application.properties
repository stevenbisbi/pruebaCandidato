spring.application.name=pagos
server.port=8080

# reWriteBatchedInserts convierte los INSERT por lotes en INSERT multi-fila (PR-02).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/conciliacion?reWriteBatchedInserts=true}
spring.datasource.username=${DB_USER:conciliacion}
spring.datasource.password=${DB_PASSWORD:conciliacion}

# PR-01 (D-06). El driver JDBC reutiliza las consultas preparadas, y desde la sexta ejecucion
# PostgreSQL usa un plan generico que no mira los valores de los filtros: con un rango de saldo
# angosto recorria las 500.000 facturas (109 ms) en vez de usar el indice (0,2 ms). Con esto el plan
# siempre se arma con los valores reales; replanificar cuesta fracciones de milisegundo.
spring.datasource.hikari.connection-init-sql=SET plan_cache_mode = force_custom_plan

# db/seed carga los 500.000 facturas desde /seed (montado en el contenedor de PostgreSQL).
spring.flyway.locations=classpath:db/migration,classpath:db/seed
spring.flyway.placeholders.seed_dir=${SEED_DIR:/seed}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Las fechas se serializan en ISO-8601 con su offset; nunca como epoch.
spring.jackson.serialization.write-dates-as-timestamps=false

# Usuario fijo (la autenticacion esta fuera de alcance, seccion 1.2). Queda en la auditoria (RF-15).
app.user=${APP_USER:cartera}
